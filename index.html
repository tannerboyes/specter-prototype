<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Specter Development</title>
  <link rel="icon" href="logo.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#fffff2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Specter" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,700;1,500;1,700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <img src="logo.png" alt="Specter" class="corner-logo" />

  <div id="password-gate" class="password-gate">
    <form id="gate-form" class="gate-card">
      <img src="logo.png" alt="Specter" class="gate-logo" />
      <h1>Specter Development</h1>
      <p class="view-sub">Enter the password to continue.</p>
      <input type="password" id="gate-password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" class="bench-primary-btn">Enter</button>
      <p class="gate-error" id="gate-error"></p>
    </form>
  </div>

  <div id="app" style="display:none;">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-name">Specter Studio</div>
        <div class="brand-sub">Select project</div>
        <div id="project-selector"></div>
      </div>
      <nav class="tabs">
        <button data-view="dashboard">Dashboard</button>
        <button data-view="tasks">Tasks</button>
        <button data-view="bench">Bench</button>
        <button data-view="shipments">Shipments</button>
        <button data-view="log">Build Log</button>
        <button data-view="archive">Archive</button>
      </nav>
      <div class="updated" id="updated"></div>
    </aside>

    <main>
      <div class="view" id="dashboard"></div>
      <div class="view" id="tasks"></div>
      <div class="view" id="bench"></div>
      <div class="view" id="shipments"></div>
      <div class="view" id="log"></div>
      <div class="view" id="archive"></div>
    </main>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
